<!DOCTYPE html>
<html>
<head>
    <title>MindMate - Schedule Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav style="text-align:center; margin-bottom: 24px;">
    <a href="/">Home</a> ·
    <a href="/routine">Routine</a> ·
    <a href="/schedule">Schedule</a> ·
    <a href="/habits">Habits</a> ·
    <a href="/dashboard">Dashboard</a> ·
    <a href="/need-to-talk">Need to Talk?</a>
</nav>
    <h1>Build your day</h1>

    <form action="/schedule" method="POST">
        <label>Wake up time: <input type="time" name="wake_time" required></label><br><br>
        <label>Sleep time: <input type="time" name="sleep_time" required></label><br><br>
        <label>Work/study hours needed: <input type="number" step="0.5" name="work_hours" required></label><br><br>
        <label>Physical activity (minutes): <input type="number" name="activity_minutes" required></label><br><br>

        <button type="submit">Generate Schedule</button>
    </form>
</body>
</html>
